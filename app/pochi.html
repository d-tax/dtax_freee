<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポチポチ手入力取引チェッカー - freee拡張ポータル</title>
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="page">
    <header>
      <div>
        <h1>ポチポチ取引チェッカー</h1>
        <p>対象事業所: <b id="currentCompanyLabel" style="color:var(--ink);">読み込み中...</b></p>
      </div>
      <img src="../images/360097.png" alt="D-Tax" class="header-logo">
    </header>

    <div class="app-header-bar">
      <a href="../index.html" class="btn-nav">← ポータルへ戻る</a>
      <span class="app-tag">使用中：ポチポチ手入力取引チェッカー</span>
    </div>

    <div class="step-box">
      <div class="step-title">抽出条件の設定</div>
      <div class="date-range-grid" style="margin-bottom: 12px;">
        <div class="date-field">
          <label>対象期間</label>
          <select class="form-select" id="pochiMonthsSelect">
            <option value="3">過去 3ヶ月</option>
            <option value="6" selected>過去 6ヶ月</option>
            <option value="12">過去 12ヶ月</option>
          </select>
        </div>
        <div class="date-field">
          <label>手入力回数の閾値（○回以上）</label>
          <input type="number" class="form-input" id="pochiMinCount" value="2" min="1">
        </div>
      </div>
      
      <div style="margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="excludeNoPartner" style="width: 16px; height: 16px; cursor: pointer;">
        <label for="excludeNoPartner" style="font-size: 13px; color: var(--ink); cursor: pointer;">「取引先が指定なし」のデータを集計から除外する</label>
      </div>

      <button class="btn-primary" id="runPochiCheckBtn" type="button">ポチポチ取引を抽出する</button>

      <div class="info-box">
        <b>【何を抽出するのか】</b><br>
        自動登録ルールが未適用のため「画面上で手動クリック（ポチポチ操作）」して登録されている繰り返し取引を抽出します。指定した期間のデータをすべて走査して集計します。
      </div>
    </div>

    <div id="pochiLoadingSection" class="loading-box hidden">
      <div class="spinner"></div>
      <div style="font-size: 13px; font-weight: 600; color: var(--navy);" id="pochiLoadingText">freeeから取引データを取得中...</div>
    </div>

    <div id="pochiResultSection" class="hidden">
      <div class="summary">
        <div class="summary-stats">
          <div class="stat"><span class="num danger" id="statPochiTotalCount">0</span><span class="lbl">改善候補パターン数</span></div>
          <div class="stat"><span class="num danger" id="statPochiManualRatio">0%</span><span class="lbl">全体の手入力比率</span></div>
        </div>
      </div>
      <div style="overflow-x: auto;">
        <table class="all-table">
          <thead>
            <tr><th>取引先 / 摘要ヒント</th><th>勘定科目</th><th>手入力回数</th><th>月平均推定量</th><th>改善インパクト</th></tr>
          </thead>
          <tbody id="pochiTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>
  </div>

  <script>
    (function () {
      "use strict";
      const token = sessionStorage.getItem('access_token');
      const companyId = sessionStorage.getItem('company_id');
      if (!token || !companyId) { window.location.href = '../index.html'; return; }
      document.getElementById('currentCompanyLabel').textContent = sessionStorage.getItem('company_name');

      document.getElementById('runPochiCheckBtn').addEventListener('click', async () => {
        const months = parseInt(document.getElementById('pochiMonthsSelect').value, 10) || 6;
        const minCount = parseInt(document.getElementById('pochiMinCount').value, 10) || 2;
        const excludeNoPartner = document.getElementById('excludeNoPartner').checked;

        const btn = document.getElementById('runPochiCheckBtn');
        const loading = document.getElementById('pochiLoadingSection');
        const loadingText = document.getElementById('pochiLoadingText');
        const result = document.getElementById('pochiResultSection');
        result.classList.add('hidden');
        loading.classList.remove('hidden');
        btn.disabled = true;

        try {
          // 指定された月数前の日付を計算 (YYYY-MM-DD)
          const targetDate = new Date();
          targetDate.setMonth(targetDate.getMonth() - months);
          const startDateStr = targetDate.toISOString().split('T')[0];

          // ページングを使用して全件取得
          let deals = [];
          let offset = 0;
          const limit = 100;

          while (true) {
            loadingText.textContent = `取引データを取得中... (${deals.length}件取得済み)`;
            const url = `https://api.freee.co.jp/api/1/deals?company_id=${companyId}&start_issue_date=${startDateStr}&limit=${limit}&offset=${offset}`;
            const res = await fetch(url, {
              headers: { 'Authorization': `Bearer ${token}`, 'accept': 'application/json' }
            });
            if (!res.ok) throw new Error(`APIエラー: ${res.status}`);
            const data = await res.json();
            const batch = data.deals || [];
            deals = deals.concat(batch);

            if (batch.length < limit) break;
            offset += limit;
          }

          loadingText.textContent = "データを解析中...";

          // 取引先×勘定科目ごとにカウント
          const freqMap = {};
          deals.forEach(d => {
            const rawPartner = d.partner_name ? d.partner_name.trim() : '';
            
            const details = d.details || [];
            details.forEach(det => {
              const account = det.account_item_name || '不明';
              const desc = det.description ? det.description.trim() : '';

              let partnerKey = rawPartner;
              let displayName = rawPartner;

              if (!rawPartner) {
                if (excludeNoPartner) {
                  return; // 除外設定がONならスキップ
                }
                if (desc) {
                  partnerKey = `[摘要一致] ${desc}`;
                  displayName = `<span style="color:var(--ink-soft); font-size:11px;">[取引先未設定]</span> ${desc}`;
                } else {
                  partnerKey = '指定なし';
                  displayName = '<span style="color:var(--ink-soft);">指定なし</span>';
                }
              }

              const key = `${partnerKey}__${account}`;
              if (!freqMap[key]) {
                freqMap[key] = { partnerDisplay: displayName, account, count: 0 };
              }
              freqMap[key].count += 1;
            });
          });

          // 指定回数以上のものを抽出
          const candidates = Object.values(freqMap).filter(item => item.count >= minCount);
          candidates.sort((a, b) => b.count - a.count);

          const tbody = document.getElementById('pochiTableBody');
          tbody.innerHTML = '';
          if (candidates.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--ink-soft);">条件に合致する手入力頻発パターンはありませんでした。（期間や閾値を変更してみてください）</td></tr>';
          } else {
            candidates.forEach(item => {
              tbody.innerHTML += `<tr><td><b>${item.partnerDisplay}</b></td><td>${item.account}</td><td style="color:var(--red); font-weight:bold;">${item.count} 回</td><td>約 ${(item.count / months).toFixed(1)} 件/月</td><td><span style="font-size:11px; background:var(--amber-soft); color:var(--amber); padding:2px 6px; border-radius:4px; font-weight:bold;">自動登録ルール推奨</span></td></tr>`;
            });
          }

          document.getElementById('statPochiTotalCount').textContent = candidates.length + ' 件';
          document.getElementById('statPochiManualRatio').textContent = deals.length > 0 ? Math.round((candidates.reduce((acc, cur) => acc + cur.count, 0) / deals.length) * 100) + '%' : '0%';
          loading.classList.add('hidden');
          result.classList.remove('hidden');
        } catch (err) {
          alert('データ取得に失敗しました: ' + err.message);
          loading.classList.add('hidden');
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
