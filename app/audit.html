<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>取引の異常値・異常入力チェッカー - freee拡張ポータル</title>
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="page">
    <header>
      <div>
        <h1>異常値・異常入力チェッカー</h1>
        <p>対象事業所: <b id="currentCompanyLabel" style="color:var(--ink);">読み込み中...</b></p>
      </div>
      <img src="../images/360097.png" alt="D-Tax" class="header-logo">
    </header>

    <div class="app-header-bar">
      <a href="../index.html" class="btn-nav">← ポータルへ戻る</a>
      <span class="app-tag">使用中：取引の異常値・異常入力チェッカー</span>
    </div>

    <div class="step-box">
      <div class="step-title">監査用チェックの実行</div>
      <div class="date-range-grid" style="margin-bottom: 12px;">
        <div class="date-field">
          <label>対象期間</label>
          <select class="form-select" id="auditMonthsSelect">
            <option value="1">当月分のみ</option>
            <option value="3" selected>過去 3ヶ月</option>
            <option value="6">過去 6ヶ月</option>
          </select>
        </div>
        <div class="date-field">
          <label>金額乖離トリガー</label>
          <select class="form-select" id="auditThresholdSelect">
            <option value="3">平均の 3倍以上</option>
            <option value="5" selected>平均の 5倍以上 (桁指定ミス等)</option>
            <option value="10">平均の 10倍以上</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" id="runAuditCheckBtn" type="button">異常値・入力ミスを抽出する</button>

      <div class="info-box">
        <b>【何を抽出するのか】</b><br>
        ・<b>金額の桁間違い</b>：平均値から大きく乖離した取引。<br>
        ・<b>税区分の矛盾</b>：いつもと異なる税区分になっている矛盾取引。
      </div>
    </div>

    <div id="auditLoadingSection" class="loading-box hidden">
      <div class="spinner"></div>
      <div style="font-size: 13px; font-weight: 600; color: var(--navy);">全仕訳・取引データを解析中...</div>
    </div>

    <div id="auditResultSection" class="hidden">
      <div class="summary">
        <div class="summary-stats">
          <div class="stat"><span class="num danger" id="statAuditTotalCount">0</span><span class="lbl">要確認の異常取引数</span></div>
        </div>
      </div>
      <div style="overflow-x: auto;">
        <table class="all-table">
          <thead>
            <tr><th>発生日 / 取引先</th><th>科目 / 登録金額</th><th>検知された異常理由</th><th>リスク度</th></tr>
          </thead>
          <tbody id="auditTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>
  </div>

  <script>
    (function () {
      "use strict";
      const token = sessionStorage.getItem('access_token');
      const companyId = sessionStorage.getItem('company_id');
      if (!token || !companyId) { window.location.href = '../index.html'; return; }
      document.getElementById('currentCompanyLabel').textContent = sessionStorage.getItem('company_name');

      document.getElementById('runOverdueBtn').addEventListener('click', async () => {
        const btn = document.getElementById('runOverdueBtn');
        const loading = document.getElementById('overdueLoadingSection');
        const result = document.getElementById('overdueResultSection');
        result.classList.add('hidden');
        loading.classList.remove('hidden');
        btn.disabled = true;

        try {
          const res = await fetch(`https://api.freee.co.jp/api/1/deals?company_id=${companyId}&type=income&settlement_status=unsettled&limit=100`, {
            headers: { 'Authorization': `Bearer ${token}`, 'accept': 'application/json' }
          });
          if (!res.ok) throw new Error(`APIエラー: ${res.status}`);
          const data = await res.json();
          const deals = data.deals || [];

          const today = new Date();
          const overdueList = [];
          let totalAmount = 0;

          deals.forEach(d => {
            // freeeの各決済(payments)の期日(due_date)をチェック
            d.payments.forEach(p => {
              if (p.status === 'unsettled' && p.due_date) {
                const dueDate = new Date(p.due_date);
                if (dueDate < today) {
                  const diffDays = Math.floor((today - dueDate) / (1000 * 60 * 60 * 24));
                  overdueList.push({
                    partner: d.partner_name || '取引先未設定',
                    date: p.due_date,
                    amount: p.amount,
                    days: diffDays
                  });
                  totalAmount += p.amount;
                }
              }
            });
          });

          const tbody = document.getElementById('overdueTableBody');
          tbody.innerHTML = '';
          if (overdueList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--ink-soft);">期日を過ぎた未決済の売掛金はありません。素晴らしいです！</td></tr>';
          } else {
            overdueList.forEach(row => {
              tbody.innerHTML += `<tr><td><b>${row.partner}</b></td><td>${row.date}</td><td style="font-weight:bold;">¥ ${row.amount.toLocaleString()}</td><td><span style="font-size:11px; background:var(--red-soft); color:var(--red); padding:2px 6px; border-radius:4px; font-weight:bold;">${row.days} 日超過</span></td></tr>`;
            });
          }

          document.getElementById('statOverdueCount').textContent = overdueList.length + ' 件';
          document.getElementById('statOverdueAmount').textContent = '¥ ' + totalAmount.toLocaleString();
          loading.classList.add('hidden');
          result.classList.remove('hidden');
        } catch (err) {
          alert('売掛金データの取得に失敗しました: ' + err.message);
          loading.classList.add('hidden');
        } finally {
          btn.disabled = false;
        }
      });
    })();
    </script>
</body>
</html>
