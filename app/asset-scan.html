<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>固定資産スキャン - freee拡張ポータル</title>
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="page">
    <header>
      <div>
        <h1>固定資産スキャン</h1>
        <p>対象事業所: <b id="currentCompanyLabel" style="color:var(--ink);">読み込み中...</b></p>
      </div>
      <img src="../images/360097.png" alt="D-Tax" class="header-logo">
    </header>

    <div class="app-header-bar">
      <a href="../index.html" class="btn-nav">← ポータルへ戻る</a>
      <span class="app-tag">使用中：固定資産スキャン</span>
    </div>

    <div class="step-box">
      <div class="step-title">固定資産・減価償却のモレチェック</div>
      <button class="btn-primary" id="runAssetScanBtn" type="button">高額消耗品・資産候補をスキャンする</button>
      <div class="info-box">
        <b>【何を抽出するのか】</b><br>
        10万円以上の購入費用で「消耗品費」として処理されているものや、固定資産台帳への登録漏れ候補を抽出します。
      </div>
    </div>

    <div id="assetLoadingSection" class="loading-box hidden">
      <div class="spinner"></div>
      <div style="font-size: 13px; font-weight: 600; color: var(--navy);">仕訳データをスキャン中...</div>
    </div>

    <div id="assetResultSection" class="hidden">
      <div class="summary">
        <div class="summary-stats">
          <div class="stat"><span class="num danger" id="statAssetCount">0</span><span class="lbl">要確認の資産候補数</span></div>
        </div>
      </div>
      <div style="overflow-x: auto;">
        <table class="all-table">
          <thead>
            <tr><th>発生日</th><th>取引先 / 内容</th><th>金額</th><th>判定理由</th></tr>
          </thead>
          <tbody id="assetTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>
  </div>

  <script>
    (function () {
      "use strict";
      const token = sessionStorage.getItem('access_token');
      const companyId = sessionStorage.getItem('company_id');
      if (!token || !companyId) { window.location.href = '../index.html'; return; }
      document.getElementById('currentCompanyLabel').textContent = sessionStorage.getItem('company_name');

      document.getElementById('runAssetScanBtn').addEventListener('click', async () => {
        const btn = document.getElementById('runAssetScanBtn');
        const loading = document.getElementById('assetLoadingSection');
        const result = document.getElementById('assetResultSection');
        result.classList.add('hidden');
        loading.classList.remove('hidden');
        btn.disabled = true;

        try {
          const res = await fetch(`https://api.freee.co.jp/api/1/deals?company_id=${companyId}&limit=100`, {
            headers: { 'Authorization': `Bearer ${token}`, 'accept': 'application/json' }
          });
          if (!res.ok) throw new Error(`APIエラー: ${res.status}`);
          const data = await res.json();
          const deals = data.deals || [];

          // 消耗品費等で10万円以上のものを抽出
          const assetCandidates = [];
          deals.forEach(d => {
            d.details.forEach(det => {
              const accName = det.account_item_name || '';
              if ((accName.includes('消耗品') || accName.includes('工具器具備品')) && det.amount >= 100000) {
                assetCandidates.push({
                  date: d.issue_date,
                  content: `${d.partner_name || '取引先不明'} (${accName})`,
                  amount: det.amount,
                  reason: `${accName}として処理されていますが 10万円以上です（固定資産・一括償却等の検討推奨）`
                });
              }
            });
          });

          const tbody = document.getElementById('assetTableBody');
          tbody.innerHTML = '';
          if (assetCandidates.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--ink-soft);">高額な消耗品費等の資産候補は見つかりませんでした。</td></tr>';
          } else {
            assetCandidates.forEach(row => {
              tbody.innerHTML += `<tr><td>${row.date}</td><td><b>${row.content}</b></td><td>¥ ${row.amount.toLocaleString()}</td><td style="color:var(--red);">${row.reason}</td></tr>`;
            });
          }

          document.getElementById('statAssetCount').textContent = assetCandidates.length + ' 件';
          loading.classList.add('hidden');
          result.classList.remove('hidden');
        } catch (err) {
          alert('データ取得に失敗しました: ' + err.message);
          loading.classList.add('hidden');
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
