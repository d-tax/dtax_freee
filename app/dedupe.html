<script>
    (function () {
      "use strict";
      const token = sessionStorage.getItem('access_token');
      const companyId = sessionStorage.getItem('company_id');
      const companyName = sessionStorage.getItem('company_name');

      if (!token || !companyId) {
        alert('ログイン情報または事業所選択が失われました。ポータルに戻ります。');
        window.location.href = '../index.html';
        return;
      }

      document.getElementById('currentCompanyLabel').textContent = companyName;

      const today = new Date();
      const oneYearAgo = new Date();
      oneYearAgo.setFullYear(today.getFullYear() - 1);
      document.getElementById('unusedEndDate').value = today.toISOString().split('T')[0];
      document.getElementById('unusedStartDate').value = oneYearAgo.toISOString().split('T')[0];

      async function callApi(endpoint) {
        const res = await fetch(`https://api.freee.co.jp/api/1${endpoint}`, {
          headers: { 'Authorization': `Bearer ${token}`, 'accept': 'application/json' }
        });
        if (!res.ok) throw new Error(`APIエラー: ${res.status}`);
        return await res.json();
      }

      // 1. 重複チェック（実際のAPIデータから名称の類似・揺れを検出）
      document.getElementById('runDedupeBtn').addEventListener('click', async () => {
        const btn = document.getElementById('runDedupeBtn');
        const loading = document.getElementById('dedupeLoadingSection');
        const result = document.getElementById('dedupeResultSection');
        result.classList.add('hidden');
        loading.classList.remove('hidden');
        btn.disabled = true;

        try {
          const data = await callApi(`/partners?company_id=${companyId}&limit=100`);
          const partners = data.partners || [];

          // 簡易的な重複判定ロジック（株式会社やスペースなどを除いた名前で比較）
          const normalizedMap = {};
          partners.forEach(p => {
            const cleanName = p.name.replace(/株式会社|有限会社|\(株\)|\（株\）|\s| /g, "").toLowerCase();
            if (!normalizedMap[cleanName]) normalizedMap[cleanName] = [];
            normalizedMap[cleanName].push(p.name);
          });

          const duplicates = Object.entries(normalizedMap).filter(([key, names]) => names.length > 1);
          
          const tbody = document.getElementById('dedupeTableBody');
          tbody.innerHTML = '';
          if (duplicates.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--ink-soft);">重複が疑われる取引先は検出されませんでした。</td></tr>';
          } else {
            duplicates.forEach(([, names], idx) => {
              tbody.innerHTML += `<tr><td><b>グループ${idx + 1}</b></td><td>${names.join(' / ')}</td><td><span style="font-size:11px; background:var(--red-soft); color:var(--red); padding:2px 6px; border-radius:4px; font-weight:bold;">表記揺れ・重複候補</span></td></tr>`;
            });
          }
          document.getElementById('statDedupeCount').textContent = duplicates.length + ' 件';
          loading.classList.add('hidden');
          result.classList.remove('hidden');
        } catch (err) {
          alert('データ取得に失敗しました: ' + err.message);
          loading.classList.add('hidden');
        } finally {
          btn.disabled = false;
        }
      });

      // 2. 未使用取引先の抽出（指定期間内に取引がない取引先を特定）
      document.getElementById('runUnusedBtn').addEventListener('click', async () => {
        const start = document.getElementById('unusedStartDate').value;
        const end = document.getElementById('unusedEndDate').value;
        if (!start || !end) { alert('期間を指定してください'); return; }

        const btn = document.getElementById('runUnusedBtn');
        const loading = document.getElementById('unusedLoadingSection');
        const result = document.getElementById('unusedResultSection');
        result.classList.add('hidden');
        loading.classList.remove('hidden');
        btn.disabled = true;

        try {
          // 並行して取引先一覧と期間内の取引を取得
          const [partnerRes, dealRes] = await Promise.all([
            callApi(`/partners?company_id=${companyId}&limit=100`),
            callApi(`/deals?company_id=${companyId}&start_issue_date=${start}&end_issue_date=${end}&limit=100`)
          ]);

          const partners = partnerRes.partners || [];
          const deals = dealRes.deals || [];

          // 期間内に使用されたpartner_idのセットを作る
          const usedPartnerIds = new Set();
          deals.forEach(d => {
            if (d.partner_id) usedPartnerIds.add(d.partner_id);
          });

          // 取引実績のない取引先を抽出
          const unusedPartners = partners.filter(p => !usedPartnerIds.has(p.id));

          const tbody = document.getElementById('unusedTableBody');
          tbody.innerHTML = '';
          if (unusedPartners.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--ink-soft);">該当する未使用取引先はありません。</td></tr>';
          } else {
            unusedPartners.forEach(p => {
              tbody.innerHTML += `<tr><td><b>${p.code || '---'}</b></td><td>${p.name}</td><td><span style="font-size:11px; background:var(--amber-soft); color:var(--amber); padding:2px 6px; border-radius:4px; font-weight:bold;">指定期間内 取引0件</span></td></tr>`;
            });
          }
          document.getElementById('statUnusedCount').textContent = unusedPartners.length + ' 件';
          loading.classList.add('hidden');
          result.classList.remove('hidden');
        } catch (err) {
          alert('データ取得に失敗しました: ' + err.message);
          loading.classList.add('hidden');
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
