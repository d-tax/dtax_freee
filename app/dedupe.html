<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>取引先台帳クリーニング - freee拡張ポータル</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .app-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .app-tag {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
    }
    .status-select {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .status-select:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .all-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .all-table th, .all-table td {
      padding: 12px 16px;
      text-align: left;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle !important;
    }
    .all-table th {
      background: var(--bg);
      font-weight: 600;
      color: var(--text-muted);
    }
    .group-last-row td {
      border-bottom: 2px solid var(--border) !important;
    }
    .group-cell {
      background: var(--primary-light);
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      border-right: 1px solid var(--border);
    }
    .info-box {
      background: var(--primary-light);
      border: 1px solid rgba(37, 99, 235, 0.2);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 16px;
      line-height: 1.6;
    }
    .loading-box {
      text-align: center;
      padding: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-top: 16px;
      box-shadow: var(--shadow-sm);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .summary {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .summary-stats {
      display: flex;
      gap: 20px;
    }
    .stat .num {
      font-size: 24px;
      font-weight: 700;
      display: block;
    }
    .stat .num.danger { color: var(--danger-text); }
    .stat .lbl {
      font-size: 12px;
      color: var(--text-muted);
    }
    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 11px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }
    .btn-secondary:hover {
      background: var(--bg);
      border-color: var(--border-hover);
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>
  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <div class="page">
    <header>
      <div class="header-left">
        <img src="../images/360097.png" alt="D-Tax Logo" class="header-logo">
        <div class="header-title-area">
          <h1>取引先台帳クリーニング</h1>
          <p>対象事業所: <b id="currentCompanyLabel" style="color:var(--text-main);">読み込み中...</b></p>
        </div>
      </div>
      
      <div class="menu-container">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="メニューを開く" type="button">
          <span></span><span></span><span></span>
        </button>
        <div class="dropdown-menu" id="dropdownMenu">
          <button class="dropdown-item" id="logoutBtn" type="button"><span>🚪</span> ログアウト</button>
        </div>
      </div>
    </header>

    <div class="app-header-bar">
      <a href="../index.html" class="btn-nav">← ポータルへ戻る</a>
      <span class="app-tag">使用中：取引先台帳クリーニング</span>
    </div>

    <!-- 機能1: 重複チェック -->
    <div class="step-box">
      <div class="step-title" style="margin-bottom: 6px;">1. 取引先台帳の重複チェック</div>
      <div class="step-desc">社名の類似度や住所の一致などを多角的に分析し、重複が疑われる取引先をグループごとにリストアップします。</div>
      <button class="btn-secondary" id="runDedupeBtn" type="button">取引先の重複登録を探す</button>
      
      <div class="info-box">
        <b>【何を抽出するのか】</b><br>
        社名や住所の類似している重複候補を抽出し、それぞれの過去の取引件数を個別に集計します。
      </div>

      <div id="dedupeLoadingSection" class="loading-box hidden">
        <div class="spinner"></div>
        <div style="font-size: 13px; font-weight: 600; color: var(--text-main);" id="dedupeLoadingText">重複取引先データを分析中...</div>
      </div>

      <div id="dedupeResultSection" class="hidden">
        <div class="summary">
          <div class="summary-stats">
            <div class="stat"><span class="num danger" id="statDedupeCount">0</span><span class="lbl">重複が疑われる取引先数（総行数）</span></div>
          </div>
        </div>
        <div style="overflow-x: auto;">
          <table class="all-table">
            <thead>
              <tr>
                <th style="width: 80px; text-align: center;">グループ</th>
                <th style="width: 130px; text-align: center;">ステータス</th>
                <th>取引先名</th>
                <th style="width: 120px; text-align: center;">過去の取引件数</th>
                <th>判定理由</th>
              </tr>
            </thead>
            <tbody id="dedupeTableBody"></tbody>
          </table>
        </div>
        <!-- CSV書き出しボタン -->
        <div style="margin-top: 16px; text-align: right;">
          <button class="btn-secondary" id="exportDedupeCsvBtn" type="button" style="padding: 10px 20px; font-size: 13px; width: auto;">選択したステータスのCSVデータを出力する</button>
        </div>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>
  </div>

  <script>
    (function () {
      "use strict";
      // カーソル・演出処理
      const cursorDot = document.getElementById('cursorDot');
      const cursorGlow = document.getElementById('cursorGlow');
      let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX; mouseY = e.clientY;
        cursorDot.style.opacity = '1'; cursorGlow.style.opacity = '1';
        cursorDot.style.left = `${mouseX}px`; cursorDot.style.top = `${mouseY}px`;
      });
      function animateGlow() {
        glowX += (mouseX - glowX) * 0.15; glowY += (mouseY - glowY) * 0.15;
        cursorGlow.style.left = `${glowX}px`; cursorGlow.style.top = `${glowY}px`;
        requestAnimationFrame(animateGlow);
      }
      animateGlow();
      window.addEventListener('click', (e) => {
        const ripple = document.createElement('div');
        ripple.className = 'ripple-wave';
        ripple.style.left = `${e.clientX}px`; ripple.style.top = `${e.clientY}px`;
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 800);
      });

      // ハンバーガーメニュー
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const dropdownMenu = document.getElementById('dropdownMenu');
      const logoutBtn = document.getElementById('logoutBtn');
      hamburgerBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('show'); });
      window.addEventListener('click', () => dropdownMenu.classList.remove('show'));
      dropdownMenu.addEventListener('click', (e) => e.stopPropagation());
      logoutBtn.addEventListener('click', () => {
        if (confirm('ログアウトしますか？')) { sessionStorage.clear(); window.location.href = '../index.html'; }
      });

      // アプリ固有ロジック
      const token = sessionStorage.getItem('access_token');
      const companyId = sessionStorage.getItem('company_id');
      const companyName = sessionStorage.getItem('company_name');

      if (!token || !companyId) {
        alert('ログイン情報または事業所選択が失われました。ポータルに戻ります。');
        window.location.href = '../index.html';
        return;
      }

      document.getElementById('currentCompanyLabel').textContent = companyName;

      async function callApi(endpoint) {
        const res = await fetch(`https://api.freee.co.jp/api/1${endpoint}`, {
          headers: { 'Authorization': `Bearer ${token}`, 'accept': 'application/json' }
        });
        if (!res.ok) throw new Error(`APIエラー: ${res.status}`);
        return await res.json();
      }

      function normalizeAddress(addr) {
        if (!addr) return '';
        return addr
          .replace(/[！-～]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
          .replace(/\s+/g, '')
          .replace(/[―ー\-－]/g, '-')
          .replace(/(丁目|番地|番|号)/g, '-')
          .replace(/-+/g, '-')
          .replace(/-$/, '')
          .toLowerCase();
      }

      function cleanCompanyName(name) {
        if (!name) return '';
        return name
          .replace(/[！-～]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
          .replace(/\s+/g, '')
          .replace(/（/g, '(').replace(/）/g, ')')
          .replace(/\(株\)|株式会社|\(有\)|有限会社|\(同\)|合同会社|\(資\)|合資会社|\(名\)|合名会社|\(一社\)|一般社団法人/g, '')
          .replace(/㈲|㊑|㈴|㈵/g, '')
          .toLowerCase();
      }

      function getLevenshteinDistance(a, b) {
        if (!a || !b) return Math.max(a ? a.length : 0, b ? b.length : 0);
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

        for (let i = 1; i <= b.length; i++) {
          for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
              matrix[i][j] = matrix[i - 1][j - 1];
            } else {
              matrix[i][j] = Math.min(
                matrix[i - 1][j - 1] + 1,
                matrix[i][j - 1] + 1,
                matrix[i - 1][j] + 1
              );
            }
          }
        }
        return matrix[b.length][a.length];
      }

      function getStringSimilarity(str1, str2) {
        if (!str1 || !str2) return 0;
        const dist = getLevenshteinDistance(str1, str2);
        const maxLen = Math.max(str1.length, str2.length);
        return maxLen === 0 ? 1.0 : (1.0 - dist / maxLen);
      }

      document.getElementById('runDedupeBtn').addEventListener('click', async () => {
        const btn = document.getElementById('runDedupeBtn');
        const loading = document.getElementById('dedupeLoadingSection');
        const loadingText = document.getElementById('dedupeLoadingText');
        const result = document.getElementById('dedupeResultSection');
        result.classList.add('hidden');
        loading.classList.remove('hidden');
        btn.disabled = true;

        try {
          loadingText.textContent = "取引先データを取得中...";
          let partners = [];
          let offset = 0;
          const limit = 100;
          while (true) {
            const data = await callApi(`/partners?company_id=${companyId}&limit=${limit}&offset=${offset}`);
            const batch = data.partners || [];
            partners = partners.concat(batch);
            if (batch.length < limit) break;
            offset += limit;
          }

          loadingText.textContent = "重複データを分析中...";

          const processed = partners.map(p => ({
            id: p.id,
            name: p.name,
            cleanName: cleanCompanyName(p.name),
            normAddr: normalizeAddress(p.address ? (p.address.street || p.address.name || '') : '')
          }));

          const visited = new Set();
          const groups = [];

          for (let i = 0; i < processed.length; i++) {
            if (visited.has(i)) continue;
            
            // グループの基準となる要素
            const baseItem = processed[i];
            baseItem.reason = "基準（比較元）";
            const currentCluster = [baseItem];
            visited.add(i);

            for (let j = i + 1; j < processed.length; j++) {
              if (visited.has(j)) continue;
              const p1 = baseItem;
              const p2 = processed[j];
              let isMatch = false;
              let matchReason = "";

              const sim = getStringSimilarity(p1.cleanName, p2.cleanName);
              if (p1.cleanName === p2.cleanName) {
                matchReason = "社名が完全一致";
                isMatch = true;
              } else if (sim >= 0.8 && p1.cleanName.length >= 2 && p2.cleanName.length >= 2) {
                matchReason = `社名が類似 (類似度: ${Math.round(sim * 100)}%)`;
                isMatch = true;
              }
              
              if (!isMatch && p1.normAddr && p2.normAddr && p1.normAddr === p2.normAddr) {
                matchReason = "住所が一致";
                isMatch = true;
              }

              if (isMatch) {
                p2.reason = matchReason;
                currentCluster.push(p2);
                visited.add(j);
              }
            }

            if (currentCluster.length > 1) {
              groups.push(currentCluster);
            }
          }

          if (groups.length > 0) {
            loadingText.textContent = "重複候補の取引件数を集計中...";
            for (let idx = 0; idx < groups.length; idx++) {
              const grp = groups[idx];
              for (let itemIdx = 0; itemIdx < grp.length; itemIdx++) {
                const item = grp[itemIdx];
                try {
                  const dData = await callApi(`/deals?company_id=${companyId}&partner_id=${item.id}&limit=100`);
                  const dealsBatch = dData.deals || [];
                  item.dealCount = dealsBatch.length;
                } catch (e) {
                  item.dealCount = 0;
                }
              }
            }
          }

          const tbody = document.getElementById('dedupeTableBody');
          tbody.innerHTML = '';
          
          if (groups.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding: 30px;">重複が疑われる取引先は検出されませんでした。</td></tr>';
            document.getElementById('statDedupeCount').textContent = '0 件';
          } else {
            let totalRows = 0;
            groups.forEach((grp, idx) => {
              grp.forEach((item, itemIdx) => {
                totalRows++;
                const isFirstInGroup = (itemIdx === 0);
                const isLastInGroup = (itemIdx === grp.length - 1);
                const rowClass = isLastInGroup ? 'group-last-row' : '';

                tbody.innerHTML += `
                  <tr class="${rowClass}">
                    ${isFirstInGroup ? `<td rowspan="${grp.length}" class="group-cell">グループ${idx + 1}</td>` : ''}
                    <td style="text-align: center;">
                      <select class="status-select">
                        <option value="利用中" selected>利用中</option>
                        <option value="アーカイブ">アーカイブ</option>
                      </select>
                    </td>
                    <td><b style="color:var(--text-main);">${item.name}</b></td>
                    <td style="text-align: center; font-variant-numeric: tabular-nums;">${item.dealCount} 件</td>
                    <td style="font-size: 12px; color: var(--text-muted);">${item.reason}</td>
                  </tr>`;
              });
            });

            document.getElementById('statDedupeCount').textContent = totalRows + ' 件';
          }

          loading.classList.add('hidden');
          result.classList.remove('hidden');
        } catch (err) {
          alert('データ取得に失敗しました: ' + err.message);
          loading.classList.add('hidden');
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById('exportDedupeCsvBtn').addEventListener('click', () => {
        const rows = document.querySelectorAll('#dedupeTableBody tr');
        if (rows.length === 0 || rows[0].innerText.includes('検出されませんでした')) {
          alert('出力するデータがありません。');
          return;
        }
        let csv = '\uFEFFグループ,ステータス,取引先名,過去の取引件数,判定理由\n';
        let lastGroup = "";
        rows.forEach(tr => {
          const cols = tr.querySelectorAll('td');
          if (cols.length >= 5) {
            lastGroup = cols[0].innerText.trim() !== "" ? cols[0].innerText.trim() : lastGroup;
            const groupVal = cols[0].innerText.trim() || lastGroup;
            const status = tr.querySelector('.status-select') ? tr.querySelector('.status-select').value : '';
            const name = `"${cols[2].innerText.replace(/"/g, '""').trim()}"`;
            const dealCount = `"${cols[3].innerText.trim()}"`;
            const reason = `"${cols[4].innerText.replace(/"/g, '""').trim()}"`;
            csv += `${groupVal},${status},${name},${dealCount},${reason}\n`;
          } else if (cols.length === 4) {
            const status = tr.querySelector('.status-select') ? tr.querySelector('.status-select').value : '';
            const name = `"${cols[1].innerText.replace(/"/g, '""').trim()}"`;
            const dealCount = `"${cols[2].innerText.trim()}"`;
            const reason = `"${cols[3].innerText.replace(/"/g, '""').trim()}"`;
            csv += `${lastGroup},${status},${name},${dealCount},${reason}\n`;
          }
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'dedupe_partners.csv';
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
      });
    })();
  </script>
</body>
</html>
