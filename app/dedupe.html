<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>取引先台帳クリーニング - freee拡張ポータル</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .status-badge { font-size: 11px; padding: 4px 10px; border-radius: 4px; font-weight: bold; display: inline-block; white-space: nowrap; }
    .status-active { background: #e6f4ea; color: #137333; }
    .status-default { background: #f1f3f4; color: #5f6368; }
    
    /* テーブル全体の高さを整え、上下中央に配置 */
    .all-table th, .all-table td {
      vertical-align: middle !important;
    }
    /* グループごとの区切り線を明確にする */
    .group-last-row td {
      border-bottom: 2px solid #cbd5e1 !important;
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="page">
    <header>
      <div>
        <h1>取引先台帳クリーニング</h1>
        <p>対象事業所: <b id="currentCompanyLabel" style="color:var(--ink);">読み込み中...</b></p>
      </div>
      <img src="../images/360097.png" alt="D-Tax" class="header-logo">
    </header>

    <div class="app-header-bar">
      <a href="../index.html" class="btn-nav">← ポータルへ戻る</a>
      <span class="app-tag">使用中：取引先台帳クリーニング</span>
    </div>

    <!-- 機能1: 重複チェック -->
    <div class="step-box">
      <div class="step-title">1. 取引先台帳の重複チェック</div>
      <button class="btn-secondary" id="runDedupeBtn" type="button">取引先の重複登録を探す</button>
      <div class="info-box">
        <b>【何を抽出するのか】</b><br>
        社名の類似度、住所の一致などを多角的に分析し、重複が疑われる取引先をグループごとにリストアップします。重複候補の取引件数を個別に高速集計します。
      </div>

      <div id="dedupeLoadingSection" class="loading-box hidden">
        <div class="spinner"></div>
        <div style="font-size: 13px; font-weight: 600; color: var(--navy);" id="dedupeLoadingText">重複取引先データを分析中...</div>
      </div>

      <div id="dedupeResultSection" class="hidden">
        <div class="summary">
          <div class="summary-stats">
            <div class="stat"><span class="num danger" id="statDedupeCount">0</span><span class="lbl">重複が疑われる取引先数（総行数）</span></div>
          </div>
        </div>
        <div style="overflow-x: auto;">
          <table class="all-table">
            <thead>
              <tr>
                <th style="width: 80px; text-align: center;">グループ</th>
                <th style="width: 40px; text-align: center;"><input type="checkbox" id="selectAllDedupe"></th>
                <th style="width: 90px; text-align: center;">ステータス</th>
                <th>取引先名</th>
                <th style="width: 120px; text-align: center;">過去の取引件数</th>
                <th style="width: 100px; text-align: center;">状態 / 判定</th>
              </tr>
            </thead>
            <tbody id="dedupeTableBody"></tbody>
          </table>
        </div>
        <!-- CSV書き出しボタン（結果の下部） -->
        <div style="margin-top: 16px; text-align: right;">
          <button class="btn-secondary" id="exportDedupeCsvBtn" type="button" style="padding: 8px 16px; font-size: 13px;">CSV書き出し</button>
        </div>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>
  </div>

  <script>
    (function () {
      "use strict";
      const token = sessionStorage.getItem('access_token');
      const companyId = sessionStorage.getItem('company_id');
      const companyName = sessionStorage.getItem('company_name');

      if (!token || !companyId) {
        alert('ログイン情報または事業所選択が失われました。ポータルに戻ります。');
        window.location.href = '../index.html';
        return;
      }

      document.getElementById('currentCompanyLabel').textContent = companyName;

      async function callApi(endpoint) {
        const res = await fetch(`https://api.freee.co.jp/api/1${endpoint}`, {
          headers: { 'Authorization': `Bearer ${token}`, 'accept': 'application/json' }
        });
        if (!res.ok) throw new Error(`APIエラー: ${res.status}`);
        return await res.json();
      }

      // --- 判定用ヘルパー関数群 ---
      function normalizeAddress(addr) {
        if (!addr) return '';
        return addr
          .replace(/[！-～]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
          .replace(/\s+/g, '')
          .replace(/[―ー\-－]/g, '-')
          .replace(/(丁目|番地|番|号)/g, '-')
          .replace(/-+/g, '-')
          .replace(/-$/, '')
          .toLowerCase();
      }

      function cleanCompanyName(name) {
        if (!name) return '';
        return name
          .replace(/[！-～]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
          .replace(/\s+/g, '')
          .replace(/（/g, '(').replace(/）/g, ')')
          .replace(/\(株\)|株式会社|\(有\)|有限会社|\(同\)|合同会社|\(資\)|合資会社|\(名\)|合名会社|\(一社\)|一般社団法人/g, '')
          .replace(/㈲|㊑|㈴|㈵/g, '')
          .toLowerCase();
      }

      function getLevenshteinDistance(a, b) {
        if (!a || !b) return Math.max(a ? a.length : 0, b ? b.length : 0);
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

        for (let i = 1; i <= b.length; i++) {
          for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
              matrix[i][j] = matrix[i - 1][j - 1];
            } else {
              matrix[i][j] = Math.min(
                matrix[i - 1][j - 1] + 1,
                matrix[i][j - 1] + 1,
                matrix[i - 1][j] + 1
              );
            }
          }
        }
        return matrix[b.length][a.length];
      }

      function getStringSimilarity(str1, str2) {
        if (!str1 || !str2) return 0;
        const dist = getLevenshteinDistance(str1, str2);
        const maxLen = Math.max(str1.length, str2.length);
        return maxLen === 0 ? 1.0 : (1.0 - dist / maxLen);
      }

      // 1. 重複チェック（重複候補に絞って取引件数を取得）
      document.getElementById('runDedupeBtn').addEventListener('click', async () => {
        const btn = document.getElementById('runDedupeBtn');
        const loading = document.getElementById('dedupeLoadingSection');
        const loadingText = document.getElementById('dedupeLoadingText');
        const result = document.getElementById('dedupeResultSection');
        result.classList.add('hidden');
        loading.classList.remove('hidden');
        btn.disabled = true;

        try {
          // 1. 取引先データの全件取得
          loadingText.textContent = "取引先データを取得中...";
          let partners = [];
          let offset = 0;
          const limit = 100;
          while (true) {
            const data = await callApi(`/partners?company_id=${companyId}&limit=${limit}&offset=${offset}`);
            const batch = data.partners || [];
            partners = partners.concat(batch);
            if (batch.length < limit) break;
            offset += limit;
          }

          loadingText.textContent = "重複データを分析中...";

          const processed = partners.map(p => ({
            id: p.id,
            name: p.name,
            cleanName: cleanCompanyName(p.name),
            normAddr: normalizeAddress(p.address ? (p.address.street || p.address.name || '') : '')
          }));

          const visited = new Set();
          const groups = [];

          for (let i = 0; i < processed.length; i++) {
            if (visited.has(i)) continue;
            const currentCluster = [processed[i]];
            visited.add(i);

            for (let j = i + 1; j < processed.length; j++) {
              if (visited.has(j)) continue;

              const p1 = processed[i];
              const p2 = processed[j];

              let isMatch = false;

              const sim = getStringSimilarity(p1.cleanName, p2.cleanName);
              if (p1.cleanName === p2.cleanName || (sim >= 0.8 && p1.cleanName.length >= 2 && p2.cleanName.length >= 2)) {
                isMatch = true;
              }

              if (!isMatch && p1.normAddr && p2.normAddr && p1.normAddr === p2.normAddr) {
                isMatch = true;
              }

              if (isMatch) {
                currentCluster.push(processed[j]);
                visited.add(j);
              }
            }

            if (currentCluster.length > 1) {
              groups.push(currentCluster);
            }
          }

          // 2. 重複候補に挙がった取引先だけに絞って、個別に取引件数を取得
          if (groups.length > 0) {
            loadingText.textContent = "重複候補の取引件数を集計中...";
            for (let idx = 0; idx < groups.length; idx++) {
              const grp = groups[idx];
              for (let itemIdx = 0; itemIdx < grp.length; itemIdx++) {
                const item = grp[itemIdx];
                try {
                  const dData = await callApi(`/deals?company_id=${companyId}&partner_id=${item.id}&limit=100`);
                  const dealsBatch = dData.deals || [];
                  item.dealCount = dealsBatch.length;
                } catch (e) {
                  item.dealCount = 0;
                }
              }
            }
          }

          const tbody = document.getElementById('dedupeTableBody');
          tbody.innerHTML = '';
          
          if (groups.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--ink-soft);">重複が疑われる取引先は検出されませんでした。</td></tr>';
            document.getElementById('statDedupeCount').textContent = '0 件';
          } else {
            let totalRows = 0;
            groups.forEach((grp, idx) => {
              grp.forEach((item, itemIdx) => {
                totalRows++;
                const isFirstInGroup = (itemIdx === 0);
                const isLastInGroup = (itemIdx === grp.length - 1);
                const rowClass = isLastInGroup ? 'group-last-row' : '';

                tbody.innerHTML += `
                  <tr class="${rowClass}">
                    ${isFirstInGroup ? `<td rowspan="${grp.length}" style="text-align: center; font-weight: bold;">グループ${idx + 1}</td>` : ''}
                    <td style="text-align: center;"><input type="checkbox" class="dedupe-row-checkbox"></td>
                    <td style="text-align: center;"><span class="status-badge status-default row-status-label">未選択</span></td>
                    <td><b>${item.name}</b></td>
                    <td style="text-align: center;">${item.dealCount} 件</td>
                    <td><span style="font-size:11px; background:var(--red-soft); color:var(--red); padding:4px 8px; border-radius:4px; font-weight:bold; white-space: nowrap;">重複候補</span></td>
                  </tr>`;
              });
            });

            document.querySelectorAll('.dedupe-row-checkbox').forEach((chk) => {
              chk.addEventListener('change', (e) => {
                const tr = e.target.closest('tr');
                const label = tr.querySelector('.row-status-label');
                if (e.target.checked) {
                  label.textContent = "使用する";
                  label.className = "status-badge status-active row-status-label";
                } else {
                  label.textContent = "未選択";
                  label.className = "status-badge status-default row-status-label";
                }
              });
            });

            document.getElementById('statDedupeCount').textContent = totalRows + ' 件';
          }

          const selectAll = document.getElementById('selectAllDedupe');
          selectAll.checked = false;
          selectAll.onchange = (e) => {
            document.querySelectorAll('.dedupe-row-checkbox').forEach(chk => {
              chk.checked = e.target.checked;
              chk.dispatchEvent(new Event('change'));
            });
          };

          loading.classList.add('hidden');
          result.classList.remove('hidden');
        } catch (err) {
          alert('データ取得に失敗しました: ' + err.message);
          loading.classList.add('hidden');
        } finally {
          btn.disabled = false;
        }
      });

      // 重複チェック CSV出力
      document.getElementById('exportDedupeCsvBtn').addEventListener('click', () => {
        const rows = document.querySelectorAll('#dedupeTableBody tr');
        if (rows.length === 0 || rows[0].innerText.includes('検出されませんでした')) {
          alert('出力するデータがありません。');
          return;
        }
        let csv = '\uFEFFグループ,ステータス,取引先名,過去の取引件数,判定\n';
        let lastGroup = "";
        rows.forEach(tr => {
          const cols = tr.querySelectorAll('td');
          if (cols.length >= 6) {
            lastGroup = cols[0].innerText.trim();
            const status = cols[2].innerText.trim();
            const name = `"${cols[3].innerText.replace(/"/g, '""').trim()}"`;
            const dealCount = `"${cols[4].innerText.trim()}"`;
            const judge = cols[5].innerText.trim();
            csv += `${lastGroup},${status},${name},${dealCount},${judge}\n`;
          } else if (cols.length === 5) {
            const status = cols[1].innerText.trim();
            const name = `"${cols[2].innerText.replace(/"/g, '""').trim()}"`;
            const dealCount = `"${cols[3].innerText.trim()}"`;
            const judge = cols[4].innerText.trim();
            csv += `${lastGroup},${status},${name},${dealCount},${judge}\n`;
          }
        });
        downloadCsv(csv, 'dedupe_partners.csv');
      });

      function downloadCsv(csvContent, filename) {
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }
    })();
  </script>
</body>
</html>
