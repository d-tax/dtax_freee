<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>freee アプリポータル & 業務効率化ツール</title>
  <link rel="icon" href="data:,">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --paper: #FAF7EF;
      --paper-deep: #F2EDE0;
      --ink: #20303B;
      --ink-soft: #5B6B72;
      --line: #DCD3BE;
      --line-soft: #EAE3D2;
      --red: #B23A2E;
      --red-soft: #F3E1DD;
      --amber: #A8792A;
      --amber-soft: #F1E6D2;
      --green: #2E6B4E;
      --green-soft: #DFEAE2;
      --navy: #22384C;
      --navy-soft: #2E4A63;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: "Hiragino Sans", "Yu Gothic Medium", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--ink);
      line-height: 1.6;
      min-height: 100%;
    }

    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(120deg, #ffecd2 0%, #fcb69f 25%, #a18cd1 50%, #fbc2eb 75%, #8fd3f4 100%);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      opacity: 0.6;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .page {
      position: relative;
      z-index: 2;
      max-width: 560px;
      margin: 44px auto;
      padding: 36px 24px 56px;
      background: rgba(255, 253, 247, 0.65);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 34px;
      box-shadow: 0 30px 80px rgba(32, 48, 59, 0.22), 0 4px 16px rgba(32, 48, 59, 0.08);
    }

    @media (max-width: 560px) {
      .page {
        margin: 0;
        border-radius: 0;
        min-height: 100vh;
        box-shadow: none;
      }
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--ink);
      margin-bottom: 28px;
    }

    .header-logo {
      flex: none;
      height: 38px;
      width: auto;
      object-fit: contain;
      margin-top: 2px;
    }

    header h1 {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 4px;
      letter-spacing: .02em;
    }

    header p { margin: 0; color: var(--ink-soft); font-size: 13px; }

    .step-box {
      background: #FFFDF7;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(32, 48, 59, 0.04);
    }

    .step-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 8px;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-desc { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }

    .form-select {
      width: 100%;
      padding: 10px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 13.5px;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .app-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

    .app-card {
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1.5px solid var(--line);
      background: #FFFDF7;
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .app-card:hover { border-color: var(--navy); background: var(--paper-deep); transform: translateY(-2px); }
    .app-card-icon { width: 48px; height: 48px; object-fit: contain; flex: none; }
    .app-card-title { font-weight: 700; font-size: 14.5px; color: var(--navy); margin-bottom: 4px; }
    .app-card-desc { font-size: 12px; color: var(--ink-soft); }

    .btn-primary {
      background: var(--navy);
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }

    .btn-primary:hover { background: var(--navy-soft); }

    .btn-nav {
      background: var(--paper-deep);
      border: 1px solid var(--line);
      color: var(--ink-soft);
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .error-box {
      margin-top: 16px;
      border: 1px solid var(--red);
      background: var(--red-soft);
      color: var(--red);
      padding: 12px 16px;
      border-radius: 11px;
      font-size: 13px;
      display: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="page">
    <header>
      <div>
        <h1 id="headerTitle">freee 拡張ポータル</h1>
        <p id="headerDesc">freee APIを活用して業務効率化ツールを利用・管理します。</p>
      </div>
      <img src="images/360097.png" alt="D-Tax" class="header-logo">
    </header>

    <!-- Step 1: ログイン画面 -->
    <div id="stepLogin" class="step-box">
      <div class="step-title">1. freee連携ログイン</div>
      <div class="step-desc">freeeアカウントで認証を行い、安全にAPIデータと連携します。</div>
      <button class="btn-primary" id="loginBtn" type="button">freeeアカウントでログイン</button>
    </div>

    <!-- Step 2: 事務所（事業所）選択画面 -->
    <div id="stepCompany" class="step-box hidden">
      <div class="step-title">2. 事業所を選択</div>
      <div class="step-desc">処理を行う対象の事業所を選択してください。</div>
      <select class="form-select" id="companySelect">
        <option value="">事業所を読み込んでいます...</option>
      </select>
      <button class="btn-primary" id="selectCompanyBtn" type="button">この事業所で進む</button>
    </div>

    <!-- Step 3: アプリ選択画面 -->
    <div id="stepApps" class="step-box hidden">
      <button class="btn-nav" id="backToCompanyBtn" type="button">← 事業所選択へ戻る</button>
      <div class="step-title" style="margin-top: 12px;">3. 利用するアプリを選択</div>
      <div class="step-desc">選択した事業所：<b id="selectedCompanyName" style="color:var(--ink);"></b></div>
      
      <div class="app-grid">
        <div class="app-card" id="appDedupeCard">
          <img src="images/icon-clean.png" alt="クリーニング" class="app-card-icon">
          <div>
            <div class="app-card-title">取引先台帳クリーニング</div>
            <div class="app-card-desc">API経由で取引先を自動取得し、重複候補や未使用の取引先を整理します。</div>
          </div>
        </div>

        <div class="app-card" id="appOverdueCard">
          <img src="images/icon-alert.png" alt="売掛金チェッカー" class="app-card-icon">
          <div>
            <div class="app-card-title">期日超過の未決済売掛金チェッカー</div>
            <div class="app-card-desc">決済期日を過ぎた未回収の売掛取引（収入）をリストアップし、回収リスクを可視化します。</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 共通エラー表示 -->
    <div class="error-box" id="errorBox"></div>
  </div>

  <script>
    (function () {
      "use strict";

      const CONFIG = {
        clientId: "803164151598495", // 必要に応じて正しいアプリのClient IDに変更してください
        redirectUri: window.location.origin + window.location.pathname,
        authEndpoint: "https://accounts.secure.freee.co.jp/public_api/authorize",
        apiBase: "https://api.freee.co.jp/api/1"
      };

      // 画面要素の取得
      const stepLogin = document.getElementById('stepLogin');
      const stepCompany = document.getElementById('stepCompany');
      const stepApps = document.getElementById('stepApps');
      const loginBtn = document.getElementById('loginBtn');
      const companySelect = document.getElementById('companySelect');
      const selectCompanyBtn = document.getElementById('selectCompanyBtn');
      const selectedCompanyName = document.getElementById('selectedCompanyName');
      const backToCompanyBtn = document.getElementById('backToCompanyBtn');
      const errorBox = document.getElementById('errorBox');

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
      }

      function clearError() {
        errorBox.textContent = '';
        errorBox.style.display = 'none';
      }

      // freee認証ページへリダイレクト
      function redirectToAuth() {
        const params = new URLSearchParams({
          client_id: CONFIG.clientId,
          redirect_uri: CONFIG.redirectUri,
          response_type: 'token'
        });
        window.location.href = `${CONFIG.authEndpoint}?${params.toString()}`;
      }

      function getAccessToken() {
        return sessionStorage.getItem('access_token');
      }

      // API呼び出し共通関数
      async function callFreeeApi(endpoint) {
        const token = getAccessToken();
        if (!token) throw new Error('認証が切れています。ログインしてください。');

        const res = await fetch(CONFIG.apiBase + endpoint, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'accept': 'application/json'
          }
        });

        if (!res.ok) {
          throw new Error(`APIエラー: ${res.status} ${res.statusText}`);
        }
        return await res.json();
      }

      // URLハッシュからアクセストークンを解析
      function handleOAuthCallback() {
        if (window.location.hash) {
          const params = new URLSearchParams(window.location.hash.substring(1));
          const token = params.get('access_token');
          if (token) {
            sessionStorage.setItem('access_token', token);
            // URLからハッシュをクリア
            history.replaceState(null, null, window.location.pathname);
          }
        }
      }

      // 事業所一覧を取得
      async function loadCompanies() {
        try {
          clearError();
          const data = await callFreeeApi('/companies');
          companySelect.innerHTML = '<option value="">選択してください</option>';
          data.companies.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.display_name || c.name;
            companySelect.appendChild(opt);
          });

          stepLogin.classList.add('hidden');
          stepCompany.classList.remove('hidden');
        } catch (err) {
          showError(err.message);
        }
      }

      // 初期化処理
      loginBtn.addEventListener('click', redirectToAuth);

      selectCompanyBtn.addEventListener('click', () => {
        const companyId = companySelect.value;
        if (!companyId) {
          alert('事業所を選択してください');
          return;
        }
        const selectedText = companySelect.options[companySelect.selectedIndex].text;
        selectedCompanyName.textContent = selectedText;
        stepCompany.classList.add('hidden');
        stepApps.classList.remove('hidden');
      });

      backToCompanyBtn.addEventListener('click', () => {
        stepApps.classList.add('hidden');
        stepCompany.classList.remove('hidden');
      });

      // ページ読み込み時の自動チェック
      handleOAuthCallback();
      if (getAccessToken()) {
        loadCompanies();
      }
    })();
  </script>
</body>
</html>
